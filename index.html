<!DOCTYPE html>

<html>
    <head>
        <title>Super Trunfo: ANIMAIS</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>TRUNFO DE OBJETOS</h1>
        <P> Esse jogo se baseia no duelo de cartas
             de objetos, aceita um duelo?

        </P>

    <!-- Cartas -->
     <div class="colecao">
        <div class="carta lendaria">
            <h2> Papel Higiênico </h2>
            <img
                src="images/PapelHigienico.jpg"
                alt="Imagem retirada de: https://pt.wikipedia.org/wiki/Papel_higi%C3%AAnico"
                width="250">

            <p class="raridade">LENDÁRIA</p>

            <ul class="atributos">
                <li>Utilidade: 100</li>
                <li>Aparência: 100</li>
                <li>AURA: 100</li>
            </ul>
        </div>

        <div class="carta rara">
            <h2> <B></B>alde </h2>
            <img
                src="images/balde.jpg"
                alt="Imagem retirada de: https://www.lepok.com.br/produto/Balde-Plastico-15-Litros-Com-Alca-Shangrila/90441?srsltid=AYCX9vL5_gxKiFEA_nEE43cZ_OkZMNzXVxN_PGg2Q9kXcZjJr6F9fz4R"
                width="250">

            <p class="raridade">RARA </p>

            <ul class="atributos">
                <li>Utilidade: 71</li>
                <li>Aparência: 38</li>
                <li>AURA: 67</li>
            </ul>
            </div>
        </div>
    </body>

</html>
