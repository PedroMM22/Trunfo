<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carta criada - Trunfo de OBJETOS</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Carta criada!</h1>

    <div class="carta {{ raridade }}">
        <img src="/static/images/{{ imagem }}" alt="{{ nome }}">
        <h2>{{ nome }}</h2>
        <p class="raridade">{{ raridade }}</p>
        <ul class="atributos">
            <li>Utilidade: {{ utilidade }}</li>
            <li>Aparência: {{ aparencia }}</li>
            <li>Aura: {{ aura }}</li>
        </ul>
        <p>Poder total: <b>{{ poder_total }}</b></p>
        <a class="botao" href="/duelo/{{ chave }}">Duelar com ela</a>
    </div>

    <a href="/">Voltar para a coleção</a>
</body>
</html>
